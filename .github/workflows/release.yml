# A GitHub release for each v* tag: the CLI's binaries under the names install.sh expects, SHA256SUMS, and a keyless
# cosign signature of the sums (Sigstore, from this workflow's OIDC identity; install.sh checks both). The release job
# waits for a maintainer's approval in the `release` environment. Each action is pinned to a full commit SHA, the
# release tag it is resolved from in the comment beside it; until it is resolved it reads a placeholder, and a run fails at
# its first step.
name: release
on:
  push:
    tags: ['v*']
permissions: {}
# One run per tag at a time. Another run for the same tag waits instead of cancelling this one: a release is
# never cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read # to check out the tagged source
    steps:
      - uses: actions/checkout@PIN_ME # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@PIN_ME # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: The tag is the CLI's version
        run: test "v$(sed -n 's/^const cliVersion = "\(.*\)"$/\1/p' cmd/tolvyn-cli/main.go)" = "$GITHUB_REF_NAME"
      - run: go vet ./...
      - run: go test ./...
  build:
    name: Build
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read # to check out the tagged source
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    steps:
      - uses: actions/checkout@PIN_ME # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@PIN_ME # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p dist
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w" \
            -o "dist/tolvyn-${GOOS}-${GOARCH}${ext}" ./cmd/tolvyn-cli
      - uses: actions/upload-artifact@PIN_ME # v7.0.2
        with:
          name: bin-${{ strategy.job-index }}
          path: dist/
          if-no-files-found: error
  release:
    name: Release
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # to create the GitHub release with its files
      id-token: write # for cosign's keyless signature (Sigstore, from this workflow's OIDC identity)
    steps:
      - uses: actions/download-artifact@PIN_ME # v8.0.2
        with:
          pattern: bin-*
          path: dist/
          merge-multiple: true
      - uses: sigstore/cosign-installer@PIN_ME # v4.1.4
      - name: Sums and signature
        working-directory: dist
        run: |
          sha256sum tolvyn-* > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          # cosign v3 (cosign-installer v4) writes Sigstore's new bundle format; check that it did, and that the bundle
          # verifies with the identity install.sh and the README give customers, before anything is published.
          grep -q 'application/vnd.dev.sigstore.bundle' SHA256SUMS.sigstore.json
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." \
            tolvyn-* SHA256SUMS SHA256SUMS.sigstore.json
